<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Battle Royale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
        }
        
        /* Orientation Screen */
        #orientation-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        
        #orientation-screen h1 {
            color: #ff5252;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #ff5252;
        }
        
        #orientation-screen .rotate-icon {
            font-size: 4rem;
            margin: 30px 0;
            animation: rotate 2s infinite linear;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(90deg); }
        }
        
        /* Fullscreen overlay */
        #fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        
        #fullscreen-overlay button {
            padding: 20px 40px;
            font-size: 1.5rem;
            background: linear-gradient(180deg, #ff5252, #b33939);
            border: 4px solid #fff;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        
        /* Main Game Container */
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
        }
        
        /* Top Bar */
        #top-bar {
            height: 70px;
            background: linear-gradient(180deg, #2d2d44, #1a1a2e);
            border-bottom: 4px solid #ff5252;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        #hamburger-btn {
            width: 50px;
            height: 50px;
            background: #33334d;
            border: 3px solid #ff5252;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 10px;
        }
        
        .hamburger-line {
            width: 30px;
            height: 4px;
            background: #fff;
            border-radius: 2px;
        }
        
        #player-info-display {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .info-pill {
            background: #33334d;
            border: 2px solid;
            border-radius: 25px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            min-width: 120px;
        }
        
        .health-pill { border-color: #4CAF50; }
        .dice-pill { border-color: #ff9800; }
        .weapon-pill { border-color: #2196F3; }
        
        .info-icon {
            font-size: 1.2rem;
        }
        
        .info-value {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        /* Main Game Area */
        #game-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #2d5a3c, #1a3a26);
        }
        
        #game-canvas {
            background: transparent;
            display: block;
            max-width: 95vh;
            max-height: calc(100vh - 170px);
            aspect-ratio: 1;
        }
        
        /* Bottom Controls */
        #bottom-controls {
            height: 100px;
            background: linear-gradient(0deg, #2d2d44, #1a1a2e);
            border-top: 4px solid #ff5252;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 0 20px;
            flex-shrink: 0;
        }
        
        /* SNES-style Button Grid */
        #button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            width: 300px;
            height: 80px;
        }
        
        .snes-button {
            background: linear-gradient(180deg, #666, #333);
            border: 3px solid #222;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3),
                        0 4px 8px rgba(0,0,0,0.5);
            transition: all 0.1s;
            padding: 5px;
        }
        
        .snes-button:active {
            transform: translateY(2px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .snes-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .snes-button.red {
            background: linear-gradient(180deg, #ff5252, #b33939);
            border-color: #8b0000;
        }
        
        .snes-button.blue {
            background: linear-gradient(180deg, #2196F3, #0d47a1);
            border-color: #002171;
        }
        
        .snes-button.green {
            background: linear-gradient(180deg, #4CAF50, #2e7d32);
            border-color: #1b5e20;
        }
        
        .snes-button.yellow {
            background: linear-gradient(180deg, #ffeb3b, #f9a825);
            border-color: #f57f17;
        }
        
        .snes-button.purple {
            background: linear-gradient(180deg, #9c27b0, #6a1b9a);
            border-color: #4a148c;
        }
        
        .snes-button.large {
            grid-column: span 2;
        }
        
        /* Aim Overlay */
        #aim-overlay, #shotgun-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .aim-cell {
            position: absolute;
            border: 2px solid #ffeb3b;
            background: rgba(255, 235, 59, 0.2);
            box-sizing: border-box;
            animation: pulse 1s infinite;
        }
        
        .shotgun-cell {
            position: absolute;
            border: 2px solid #ff9800;
            background: rgba(255, 152, 0, 0.15);
            box-sizing: border-box;
        }
        
        /* Damage Effect */
        .damage-effect {
            position: absolute;
            color: #ff4444;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            z-index: 1000;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(0.8); opacity: 0; }
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        
        /* Side Panel (Hamburger Menu) */
        #side-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100vh;
            background: linear-gradient(180deg, #1a1a2e, #2d2d44);
            border-left: 4px solid #ff5252;
            z-index: 100;
            transition: right 0.3s ease;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        #side-panel.open {
            right: 0;
        }
        
        #side-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        #side-panel-header h2 {
            color: #ff5252;
            text-shadow: 0 0 10px #ff5252;
        }
        
        #close-panel {
            width: 40px;
            height: 40px;
            background: #ff5252;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .player-card {
            background: rgba(51, 51, 77, 0.8);
            border: 2px solid;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .player-card.current {
            border-color: #ff5252;
            box-shadow: 0 0 20px rgba(255, 82, 82, 0.5);
        }
        
        .player-card h3 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .health-bar-container {
            height: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .health-bar {
            height: 100%;
            transition: width 0.5s ease;
        }
        
        .player-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        
        .stat-label {
            color: #aaa;
        }
        
        .stat-value {
            color: #fff;
            font-weight: bold;
        }
        
        /* Turn Indicator */
        #turn-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 2rem;
            font-weight: bold;
            border: 4px solid;
            z-index: 50;
            box-shadow: 0 0 30px currentColor;
            animation: slideIn 0.5s ease;
            display: none;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        /* Rules Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-content {
            background: linear-gradient(180deg, #1a1a2e, #2d2d44);
            border: 4px solid #ff5252;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            color: #ff5252;
            text-shadow: 0 0 10px #ff5252;
        }
        
        .close-modal {
            width: 40px;
            height: 40px;
            background: #ff5252;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .weapon-grid, .gear-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .weapon-card, .gear-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid;
        }
        
        /* House Indicator */
        #house-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            padding: 10px 20px;
            border-radius: 15px;
            border: 3px solid #f72585;
            color: #f72585;
            font-weight: bold;
            display: none;
            z-index: 20;
        }
        
        /* Mobile-specific adjustments */
        @media (max-height: 700px) {
            #top-bar { height: 60px; }
            #bottom-controls { height: 90px; }
            .info-pill { min-width: 100px; padding: 6px 12px; font-size: 0.8rem; }
            .snes-button { font-size: 0.8rem; }
        }
        
        @media (max-height: 600px) {
            #top-bar { height: 50px; }
            #bottom-controls { height: 80px; }
            .info-pill { min-width: 90px; padding: 5px 10px; font-size: 0.75rem; }
            .snes-button { font-size: 0.75rem; padding: 4px; }
            #button-grid { height: 70px; }
        }
        
        /* Force landscape orientation */
        @media (orientation: portrait) {
            #orientation-screen {
                display: flex;
            }
            #game-container {
                display: none;
            }
        }
        
        @media (orientation: landscape) {
            #orientation-screen {
                display: none;
            }
            #game-container {
                display: flex;
            }
        }
        
        /* Prevent text selection */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="no-select">
    <!-- Orientation Screen -->
    <div id="orientation-screen">
        <h1>BATTLE ROYALE</h1>
        <div class="rotate-icon">📱</div>
        <p style="font-size: 1.5rem; color: #4cc9f0; margin-bottom: 20px;">Please rotate your device to landscape mode</p>
        <p style="color: #aaa; max-width: 400px;">This game is optimized for landscape mode. Turn your phone sideways to begin the battle!</p>
    </div>
    
    <!-- Fullscreen Overlay -->
    <div id="fullscreen-overlay">
        <h1 style="color: #ff5252; font-size: 2.5rem; text-shadow: 0 0 10px #ff5252;">BATTLE ROYALE</h1>
        <button id="enter-fullscreen">ENTER BATTLE</button>
        <p style="color: #4cc9f0; margin-top: 20px; text-align: center; max-width: 500px;">
            Last player standing wins!<br>
            Roll dice, move, aim, shoot!
        </p>
    </div>
    
    <!-- Main Game Container -->
    <div id="game-container">
        <!-- Top Bar -->
        <div id="top-bar">
            <div id="hamburger-btn">
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
            </div>
            
            <div id="player-info-display">
                <div class="info-pill health-pill">
                    <span class="info-icon">❤️</span>
                    <span class="info-value" id="health-value">100</span>
                </div>
                <div class="info-pill dice-pill">
                    <span class="info-icon">🎲</span>
                    <span class="info-value" id="dice-value">0</span>
                </div>
                <div class="info-pill weapon-pill">
                    <span class="info-icon" id="weapon-icon">🔫</span>
                    <span class="info-value" id="weapon-name">Pistol</span>
                    <span style="font-size: 0.8rem; color: #aaa;" id="weapon-range">(5)</span>
                </div>
            </div>
        </div>
        
        <!-- Main Game Area -->
        <div id="game-area">
            <canvas id="game-canvas"></canvas>
            <div id="aim-overlay"></div>
            <div id="shotgun-preview"></div>
            
            <!-- Turn Indicator -->
            <div id="turn-indicator"></div>
            
            <!-- House Indicator -->
            <div id="house-indicator">🏠 IN HOUSE</div>
        </div>
        
        <!-- Bottom Controls -->
        <div id="bottom-controls">
            <div id="button-grid">
                <button class="snes-button red large" id="roll-dice-btn" onclick="game.rollDice()">
                    🎲 ROLL DICE
                </button>
                <button class="snes-button yellow" id="aim-btn" onclick="game.enterAim()">
                    🎯 AIM
                </button>
                
                <button class="snes-button blue" onclick="game.movePlayer(-1, 0)">←</button>
                <button class="snes-button blue" onclick="game.movePlayer(0, -1)">↑</button>
                <button class="snes-button blue" onclick="game.movePlayer(0, 1)">↓</button>
                <button class="snes-button blue" onclick="game.movePlayer(1, 0)">→</button>
                
                <button class="snes-button purple large" id="shoot-btn" onclick="game.shoot()">
                    🔥 SHOOT
                </button>
                <button class="snes-button green" id="end-turn-btn" onclick="game.endTurn()">
                    ⏭️ END
                </button>
            </div>
        </div>
    </div>
    
    <!-- Side Panel -->
    <div id="side-panel">
        <div id="side-panel-header">
            <h2>PLAYER INFO</h2>
            <button id="close-panel">×</button>
        </div>
        
        <div id="players-list">
            <!-- Player cards will be inserted here -->
        </div>
        
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
            <button class="snes-button red" onclick="game.showRules()">📖 RULES</button>
            <button class="snes-button yellow" onclick="game.resetGame()">🔄 RESET</button>
        </div>
    </div>
    
    <!-- Rules Modal -->
    <div id="rules-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>BATTLE ROYALE RULES</h2>
                <button class="close-modal" onclick="game.closeRules()">×</button>
            </div>
            <div id="rules-content">
                <!-- Rules content will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        class MobileBattleRoyale {
            constructor() {
                // Game configuration
                this.GRID_SIZE = 12; // Smaller for mobile
                this.TILE_SIZE = 0; // Will be calculated based on screen size
                this.PLAYER_COUNT = 4;
                
                // Game state
                this.currentPlayer = 0;
                this.movesLeft = 0;
                this.hasShot = false;
                this.hasRolled = false;
                this.gameActive = true;
                this.isIndoor = false;
                this.currentHouse = null;
                
                // Aim state
                this.aiming = false;
                this.aim = {
                    x: null,
                    y: null,
                    dx: null,
                    dy: null,
                    steps: 0
                };
                
                // Mobile-specific
                this.canvasSize = 0;
                this.isFullscreen = false;
                
                // Initialize
                this.init();
            }
            
            init() {
                // Setup canvas first
                this.setupCanvas();
                
                // Setup event listeners
                this.setupEvents();
                
                // Initialize game systems
                this.initMap();
                this.initPlayers();
                this.initWeapons();
                this.initGear();
                
                // Show fullscreen overlay
                document.getElementById('fullscreen-overlay').style.display = 'flex';
                
                // Initialize UI
                this.updateUI();
            }
            
            setupCanvas() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.aimOverlay = document.getElementById('aim-overlay');
                this.shotgunPreview = document.getElementById('shotgun-preview');
                
                // Calculate optimal canvas size
                this.updateCanvasSize();
                
                // Add resize listener
                window.addEventListener('resize', () => {
                    this.updateCanvasSize();
                    this.draw();
                });
                
                // Focus canvas for better touch handling
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.canvas.focus();
                });
            }
            
            updateCanvasSize() {
                // Calculate maximum square that fits in game area
                const gameArea = document.getElementById('game-area');
                const size = Math.min(
                    gameArea.clientWidth - 40, // -40px for padding
                    gameArea.clientHeight - 40
                );
                
                this.canvasSize = Math.floor(size);
                this.canvas.width = this.canvasSize;
                this.canvas.height = this.canvasSize;
                
                // Calculate tile size
                this.TILE_SIZE = Math.floor(this.canvasSize / this.GRID_SIZE);
                
                // Update overlay sizes
                this.aimOverlay.style.width = this.canvasSize + 'px';
                this.aimOverlay.style.height = this.canvasSize + 'px';
                this.shotgunPreview.style.width = this.canvasSize + 'px';
                this.shotgunPreview.style.height = this.canvasSize + 'px';
            }
            
            setupEvents() {
                // Enter fullscreen
                document.getElementById('enter-fullscreen').addEventListener('click', () => {
                    this.enterFullscreen();
                });
                
                // Hamburger menu
                document.getElementById('hamburger-btn').addEventListener('click', () => {
                    document.getElementById('side-panel').classList.add('open');
                });
                
                document.getElementById('close-panel').addEventListener('click', () => {
                    document.getElementById('side-panel').classList.remove('open');
                });
                
                // Close panel when clicking outside
                document.getElementById('game-container').addEventListener('click', (e) => {
                    if (!e.target.closest('#side-panel') && !e.target.closest('#hamburger-btn')) {
                        document.getElementById('side-panel').classList.remove('open');
                    }
                });
                
                // Keyboard controls for testing
                window.addEventListener('keydown', (e) => {
                    const keyMap = {
                        'ArrowUp': [0, -1], 'w': [0, -1],
                        'ArrowDown': [0, 1], 's': [0, 1],
                        'ArrowLeft': [-1, 0], 'a': [-1, 0],
                        'ArrowRight': [1, 0], 'd': [1, 0],
                        ' ': () => this.rollDice(),
                        'Enter': () => this.shoot(),
                        'Escape': () => document.getElementById('side-panel').classList.remove('open')
                    };
                    
                    const action = keyMap[e.key];
                    if (action) {
                        e.preventDefault();
                        if (typeof action === 'function') {
                            action();
                        } else if (this.aiming) {
                            this.moveAim(...action);
                        } else if (this.movesLeft > 0 || this.isIndoor) {
                            this.movePlayer(...action);
                        }
                    }
                });
                
                // Request fullscreen on first touch
                document.addEventListener('touchstart', () => {
                    if (!this.isFullscreen) {
                        this.enterFullscreen();
                    }
                }, { once: true });
            }
            
            enterFullscreen() {
                const elem = document.documentElement;
                
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
                
                document.getElementById('fullscreen-overlay').style.display = 'none';
                this.isFullscreen = true;
                
                // Start the game
                this.startGame();
            }
            
            startGame() {
                // Update canvas size for fullscreen
                this.updateCanvasSize();
                
                // Initial draw
                this.draw();
                
                // Show turn indicator
                this.showTurnIndicator();
                
                // Start game loop
                this.gameLoop();
            }
            
            // Game systems (same as original but adapted for mobile)
            initMap() {
                this.map = [];
                this.houses = [];
                
                for (let y = 0; y < this.GRID_SIZE; y++) {
                    this.map[y] = [];
                    for (let x = 0; x < this.GRID_SIZE; x++) {
                        const r = Math.random();
                        if (r < 0.1) {
                            this.map[y][x] = { type: '🌳', blocks: true, cover: true };
                        } else if (r < 0.15) {
                            this.map[y][x] = { type: '🪨', blocks: true, cover: true };
                        } else if (r < 0.18) {
                            // Houses
                            this.map[y][x] = { type: '🏠', blocks: false, house: true };
                            this.houses.push({ 
                                x, y, 
                                indoorMap: this.createIndoorMap(),
                                playersInside: [],
                                entranceX: x,
                                entranceY: y
                            });
                        } else if (r < 0.22) {
                            // Item crates
                            this.map[y][x] = { type: '📦', blocks: false, item: true };
                        } else {
                            this.map[y][x] = null;
                        }
                    }
                }
                
                // Clear starting corners
                const corners = [
                    [0, this.GRID_SIZE-1],
                    [0, 0],
                    [this.GRID_SIZE-1, 0],
                    [this.GRID_SIZE-1, this.GRID_SIZE-1]
                ];
                
                corners.forEach(([x, y]) => {
                    this.map[y][x] = null;
                });
            }
            
            createIndoorMap() {
                // 6x6 indoor map for mobile
                const indoorSize = 6;
                const indoorMap = [];
                
                // Create empty map
                for (let y = 0; y < indoorSize; y++) {
                    indoorMap[y] = [];
                    for (let x = 0; x < indoorSize; x++) {
                        indoorMap[y][x] = null;
                    }
                }
                
                // Door position
                const doorX = Math.floor(indoorSize / 2) - 1;
                const doorY = indoorSize - 1;
                
                // Set door
                indoorMap[doorY][doorX] = { type: '🚪', blocks: false, door: true };
                
                // Create walls
                for (let y = 0; y < indoorSize; y++) {
                    for (let x = 0; x < indoorSize; x++) {
                        if (x === 0 || y === 0 || x === indoorSize-1 || y === indoorSize-1) {
                            if (x === doorX && y === doorY) continue;
                            indoorMap[y][x] = { type: '🧱', blocks: true };
                        }
                    }
                }
                
                // Furniture and items
                const furniture = ['🛋️', '🪑'];
                const foodItems = ['🍎', '🍗'];
                
                for (let y = 1; y < indoorSize - 1; y++) {
                    for (let x = 1; x < indoorSize - 1; x++) {
                        // Skip door area
                        if (x >= doorX-1 && x <= doorX+1 && y >= doorY-1) continue;
                        
                        const r = Math.random();
                        
                        if (r < 0.3) {
                            const furnitureType = furniture[Math.floor(Math.random() * furniture.length)];
                            indoorMap[y][x] = { type: furnitureType, blocks: true };
                        } else if (r < 0.35) {
                            const foodType = foodItems[Math.floor(Math.random() * foodItems.length)];
                            indoorMap[y][x] = { 
                                type: foodType, 
                                blocks: false, 
                                food: true, 
                                healAmount: foodType === '🍎' ? 15 : 25 
                            };
                        } else if (r < 0.4) {
                            indoorMap[y][x] = { type: '📦', blocks: false, item: true };
                        }
                    }
                }
                
                return indoorMap;
            }

            // Gameplay methods (adapted for mobile)
            rollDice() {
                if (this.hasRolled || this.isIndoor || !this.gameActive) return;
                
                const dice1 = Math.floor(Math.random() * 6) + 1;
                const dice2 = Math.floor(Math.random() * 6) + 1;
                this.movesLeft = dice1 + dice2;
                this.hasRolled = true;
                
                // Apply speed boots
                const player = this.players[this.currentPlayer];
                player.gear.forEach(g => {
                    if (g.effect === 'movementBonus') {
                        this.movesLeft += g.value;
                    }
                });
                
                this.updateUI();
                this.showNotification(`🎲 Rolled ${dice1}+${dice2}=${this.movesLeft} moves!`);
                this.vibrate(100);
            }
            
            movePlayer(dx, dy) {
                if (this.aiming) return;
                
                const player = this.players[this.currentPlayer];
                
                if (this.isIndoor) {
                    this.movePlayerIndoor(player, dx, dy);
                } else {
                    if (this.movesLeft <= 0) return;
                    this.movePlayerOutdoor(player, dx, dy);
                }
                
                this.vibrate(50);
            }
            
            movePlayerOutdoor(player, dx, dy) {
                const newX = player.x + dx;
                const newY = player.y + dy;
                
                if (newX < 0 || newY < 0 || newX >= this.GRID_SIZE || newY >= this.GRID_SIZE) {
                    return;
                }
                
                const tile = this.map[newY][newX];
                if (!tile) {
                    if (this.players.some(p => p.alive && p !== player && !p.inHouse && p.x === newX && p.y === newY)) {
                        return;
                    }
                    
                    player.x = newX;
                    player.y = newY;
                    this.movesLeft--;
                } else if (tile.blocks) {
                    return;
                } else if (tile.house) {
                    this.enterHouse(player, newX, newY);
                    return;
                } else if (tile.item) {
                    player.x = newX;
                    player.y = newY;
                    this.movesLeft--;
                    this.pickupItem(newX, newY);
                }
                
                this.updateUI();
                this.draw();
            }
            
            enterAim() {
                if (this.aiming || this.hasShot || !this.gameActive) return;
                
                const player = this.players[this.currentPlayer];
                this.aiming = true;
                
                if (this.isIndoor && player.indoorPos) {
                    this.aim = {
                        x: player.indoorPos.x,
                        y: player.indoorPos.y,
                        dx: null,
                        dy: null,
                        steps: 0
                    };
                } else {
                    this.aim = {
                        x: player.x,
                        y: player.y,
                        dx: null,
                        dy: null,
                        steps: 0
                    };
                }
                
                this.updateAimCursor();
                this.vibrate(50);
                this.updateUI();
            }
            
            shoot() {
                if (!this.aiming || this.hasShot || !this.gameActive) return;
                
                const shooter = this.players[this.currentPlayer];
                const weapon = this.weapons[shooter.weapon];
                
                // Determine target
                const target = this.findTargetAt(shooter, this.aim.x, this.aim.y);
                
                if (target) {
                    if (this.checkLineOfSight(shooter, target)) {
                        this.applyDamage(shooter, target, weapon.damage);
                        this.showNotification(`💥 Hit! -${weapon.damage} damage`);
                    } else {
                        this.showNotification('❌ Shot blocked!');
                    }
                } else {
                    this.showNotification('💨 Missed!');
                }
                
                // Reset aim
                this.hasShot = true;
                this.aiming = false;
                this.aimOverlay.innerHTML = '';
                this.shotgunPreview.innerHTML = '';
                
                this.updateUI();
                this.draw();
                this.vibrate(200);
            }
            
            endTurn() {
                if (!this.gameActive) return;
                
                // Reset turn state
                this.movesLeft = 0;
                this.hasShot = false;
                this.hasRolled = false;
                this.aiming = false;
                this.aimOverlay.innerHTML = '';
                this.shotgunPreview.innerHTML = '';
                
                // Find next alive player
                let attempts = 0;
                let newPlayerIndex = this.currentPlayer;
                
                do {
                    newPlayerIndex = (newPlayerIndex + 1) % this.PLAYER_COUNT;
                    attempts++;
                    if (attempts > this.PLAYER_COUNT) {
                        this.gameActive = false;
                        break;
                    }
                } while (!this.players[newPlayerIndex].alive && this.gameActive);
                
                if (this.gameActive) {
                    this.currentPlayer = newPlayerIndex;
                    
                    // Update view for current player
                    this.updateViewForCurrentPlayer();
                    
                    // Show turn indicator
                    this.showTurnIndicator();
                    
                    this.updateUI();
                    this.updateSidePanel();
                    this.vibrate(100);
                }
            }
            
            // UI methods
            updateUI() {
                const player = this.players[this.currentPlayer];
                
                // Update top bar info
                document.getElementById('health-value').textContent = player.hp;
                document.getElementById('dice-value').textContent = this.movesLeft;
                
                const weapon = this.weapons[player.weapon];
                document.getElementById('weapon-name').textContent = weapon.name;
                document.getElementById('weapon-icon').textContent = weapon.emoji;
                
                // Calculate range with scope bonus
                let range = weapon.range;
                player.gear.forEach(g => {
                    if (g.effect === 'rangeBonus') range += g.value;
                });
                document.getElementById('weapon-range').textContent = `(${range})`;
                
                // Update button states
                document.getElementById('roll-dice-btn').disabled = this.hasRolled || this.isIndoor;
                document.getElementById('aim-btn').disabled = this.hasShot || this.aiming;
                document.getElementById('shoot-btn').disabled = !this.aiming || this.hasShot;
                document.getElementById('end-turn-btn').disabled = false;
                
                // Update house indicator
                const houseIndicator = document.getElementById('house-indicator');
                if (this.isIndoor) {
                    houseIndicator.style.display = 'block';
                } else {
                    houseIndicator.style.display = 'none';
                }
            }
            
            updateSidePanel() {
                const playersList = document.getElementById('players-list');
                playersList.innerHTML = '';
                
                this.players.forEach((player, index) => {
                    if (!player.alive) return;
                    
                    const playerCard = document.createElement('div');
                    playerCard.className = `player-card ${index === this.currentPlayer ? 'current' : ''}`;
                    
                    const playerColor = index === 0 ? '#ff5252' : 
                                      index === 1 ? '#2196F3' : 
                                      index === 2 ? '#4CAF50' : '#ffeb3b';
                    
                    const healthPercent = (player.hp / player.maxHp) * 100;
                    const healthColor = healthPercent > 50 ? '#4CAF50' : 
                                       healthPercent > 25 ? '#ff9800' : '#f44336';
                    
                    playerCard.innerHTML = `
                        <h3>
                            <span>${player.emoji} Player ${index + 1}</span>
                            <span style="color: ${playerColor}">${player.inHouse ? '🏠' : '🌳'}</span>
                        </h3>
                        <div class="health-bar-container">
                            <div class="health-bar" style="width: ${healthPercent}%; background: ${healthColor};"></div>
                        </div>
                        <div class="player-stats">
                            <div>
                                <div class="stat-label">Weapon:</div>
                                <div class="stat-value">${this.weapons[player.weapon].name}</div>
                            </div>
                            <div>
                                <div class="stat-label">Armor:</div>
                                <div class="stat-value">${player.armor ? player.armor.emoji + ' ' + player.armor.name : 'None'}</div>
                            </div>
                            <div>
                                <div class="stat-label">Position:</div>
                                <div class="stat-value">${this.isIndoor && player.inHouse ? 
                                    `House (${player.indoorPos.x},${player.indoorPos.y})` : 
                                    `(${player.x},${player.y})`}</div>
                            </div>

                            </div>

                    `;
                    
                    playersList.appendChild(playerCard);

            showTurnIndicator() {
                const indicator = document.getElementById('turn-indicator');
                const colors = ['#ff5252', '#2196F3', '#4CAF50', '#ffeb3b'];
                
                indicator.textContent = `PLAYER ${this.currentPlayer + 1}'S TURN`;
                indicator.style.borderColor = colors[this.currentPlayer];
                indicator.style.color = colors[this.currentPlayer];
                indicator.style.display = 'block';
                
                setTimeout(() => {
                    indicator.style.display = 'none';
                }, 2000);
                
                this.vibrate(150);
            }
            
            showNotification(message, duration = 2000) {
                // Create notification element
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);

                    border-radius: 15px;
                    border: 3px solid #4cc9f0;
                    font-weight: bold;
                    font-size: 1.2rem;
                    z-index: 100;
                    text-align: center;
                    animation: fadeInOut 2s ease;
                `;
                
                // Add keyframes for animation
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes fadeInOut {
                        0% { opacity: 0; transform: translate(-50%, -40%); }
                        10% { opacity: 1; transform: translate(-50%, -50%); }
                        90% { opacity: 1; transform: translate(-50%, -50%); }
                        100% { opacity: 0; transform: translate(-50%, -60%); }
                    }
                `;
                document.head.appendChild(style);
                
                notification.textContent = message;
                document.getElementById('game-area').appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                    style.remove();
                }, duration);
            }

            resetGame() {
                if (!confirm("Reset the game? All progress will be lost.")) return;
                
                // Reset game state
                this.currentPlayer = 0;
                this.movesLeft = 0;
                this.hasShot = false;
                this.hasRolled = false;
                this.gameActive = true;
                this.isIndoor = false;
                this.currentHouse = null;
                this.aiming = false;
                
                // Reinitialize
                this.initMap();
                this.initPlayers();
                this.initWeapons();
                this.initGear();
                
                // Clear overlays
                this.aimOverlay.innerHTML = '';
                this.shotgunPreview.innerHTML = '';
                
                // Update UI
                this.updateUI();
                this.updateSidePanel();
                this.draw();
                
                this.showTurnIndicator();
                this.showNotification("Game Reset! Player 1 starts.");
                this.vibrate(200);
            }
            
            // Drawing methods
            draw() {
                this.ctx.clearRect(0, 0, this.canvasSize, this.canvasSize);
                
                if (this.isIndoor) {
                    this.drawIndoor();
                } else {
                    this.drawOutdoor();
                }
            }
            
            drawOutdoor() {
                // Draw grid background
                for (let y = 0; y < this.GRID_SIZE; y++) {
                    for (let x = 0; x < this.GRID_SIZE; x++) {
                        // Tile background
                        this.ctx.fillStyle = (x + y) % 2 === 0 ? '#2d5a3c' : '#264d35';
                        this.ctx.fillRect(
                            x * this.TILE_SIZE,
                            y * this.TILE_SIZE,
                            this.TILE_SIZE,
                            this.TILE_SIZE
                        );
                        
                        // Tile border
                        this.ctx.strokeStyle = '#3a7d44';
                        this.ctx.strokeRect(
                            x * this.TILE_SIZE,
                            y * this.TILE_SIZE,
                            this.TILE_SIZE,
                            this.TILE_SIZE
                        );
                        
                        // Tile content
                        const tile = this.map[y][x];
                        if (tile) {
                            this.ctx.font = `${this.TILE_SIZE * 0.5}px Arial`;
                            this.ctx.textAlign = 'center';
                            this.ctx.textBaseline = 'middle';
                            
                            // Set color based on tile type
                            if (tile.type === '🌳') this.ctx.fillStyle = '#2e7d32';
                            else if (tile.type === '🪨') this.ctx.fillStyle = '#757575';
                            else if (tile.type === '🏠') this.ctx.fillStyle = '#8d6e63';
                            else if (tile.type === '📦') this.ctx.fillStyle = '#ffd700';
                            
                            this.ctx.fillText(
                                tile.type,
                                x * this.TILE_SIZE + this.TILE_SIZE / 2,
                                y * this.TILE_SIZE + this.TILE_SIZE / 2
                            );
                        }
                    }
                }
                
                // Draw players
                this.players.forEach((player, index) => {
                    if (!player.alive || player.inHouse) return;
                    
                    this.drawPlayer(player, index, player.x, player.y);
                });
            }
            
            drawIndoor() {
                if (!this.currentHouse) return;
                
                const indoorSize = 6;
                const indoorTileSize = this.canvasSize / indoorSize;
                
                // Calculate offset to center indoor map
                const offsetX = (this.canvasSize - indoorSize * indoorTileSize) / 2;
                const offsetY = (this.canvasSize - indoorSize * indoorTileSize) / 2;
                
                // Draw indoor background
                this.ctx.fillStyle = '#3a2c2c';
                this.ctx.fillRect(offsetX, offsetY, indoorSize * indoorTileSize, indoorSize * indoorTileSize);
                
                // Draw indoor tiles
                for (let y = 0; y < indoorSize; y++) {
                    for (let x = 0; x < indoorSize; x++) {
                        const tile = this.currentHouse.indoorMap[y][x];
                        
                        // Tile border
                        this.ctx.strokeStyle = '#a0522d';
                        this.ctx.strokeRect(
                            x * indoorTileSize + offsetX,
                            y * indoorTileSize + offsetY,
                            indoorTileSize,
                            indoorTileSize
                        );
                        
                        // Tile content
                        if (tile) {
                            this.ctx.font = `${indoorTileSize * 0.5}px Arial`;
                            this.ctx.textAlign = 'center';
                            this.ctx.textBaseline = 'middle';
                            
                            if (tile.type === '🧱') this.ctx.fillStyle = '#795548';
                            else if (tile.type === '🛋️') this.ctx.fillStyle = '#ff9800';
                            else if (tile.type === '🪑') this.ctx.fillStyle = '#8d6e63';
                            else if (tile.type === '📦') this.ctx.fillStyle = '#ffd700';
                            else if (tile.type === '🚪') this.ctx.fillStyle = '#4CAF50';
                            else if (tile.food) {
                                this.ctx.fillStyle = tile.type === '🍎' ? '#f44336' : '#ff9800';
                            }
                            
                            this.ctx.fillText(
                                tile.type,
                                x * indoorTileSize + offsetX + indoorTileSize / 2,
                                y * indoorTileSize + offsetY + indoorTileSize / 2
                            );
                        }
                    }
                }
                
                // Draw indoor players
                this.players.forEach((player, index) => {
                    if (!player.alive || player.inHouse !== this.currentHouse) return;
                    
                    this.drawPlayer(
                        player, 
                        index, 
                        player.indoorPos.x, 
                        player.indoorPos.y, 
                        offsetX, 
                        offsetY,
                        indoorTileSize
                    );
                });
            }
            
            drawPlayer(player, index, x, y, offsetX = 0, offsetY = 0, tileSize = this.TILE_SIZE) {
                const screenX = x * tileSize + offsetX;
                const screenY = y * tileSize + offsetY;
                
                // Player colors
                const colors = ['#ff5252', '#2196F3', '#4CAF50', '#ffeb3b'];
                const playerColor = colors[index];
                
                // Draw player circle with glow if current player
                if (index === this.currentPlayer) {
                    this.ctx.shadowColor = playerColor;
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowOffsetX = 0;
                    this.ctx.shadowOffsetY = 0;
                }
                
                // Draw player circle
                this.ctx.fillStyle = playerColor;
                this.ctx.beginPath();
                this.ctx.arc(
                    screenX + tileSize / 2,
                    screenY + tileSize / 2,
                    tileSize / 2 - 4,
                    0,
                    Math.PI * 2
                );
                this.ctx.fill();
                
                // Reset shadow
                this.ctx.shadowColor = 'transparent';
                this.ctx.shadowBlur = 0;
                
                // Draw player emoji
                this.ctx.font = `${tileSize * 0.5}px Arial`;
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillStyle = '#fff';
                this.ctx.fillText(
                    player.emoji,
                    screenX + tileSize / 2,
                    screenY + tileSize / 2
                );
                
                // Draw health bar
                const barWidth = tileSize - 8;
                const barHeight = 6;
                const barX = screenX + 4;
                const barY = screenY - 10;
                
                // Background
                this.ctx.fillStyle = '#333';
                this.ctx.fillRect(barX, barY, barWidth, barHeight);
                
                // Health
                const healthPercent = player.hp / player.maxHp;
                const healthWidth = healthPercent * barWidth;
                
                this.ctx.fillStyle = healthPercent > 0.5 ? '#4CAF50' : 
                                   healthPercent > 0.25 ? '#ff9800' : '#f44336';
                this.ctx.fillRect(barX, barY, healthWidth, barHeight);
            }
            
            // Helper methods (similar to original but simplified)
            updateAimCursor() {
                this.aimOverlay.innerHTML = '';
                
                if (!this.aiming) return;
                
                let x, y, tileSize;
                
                if (this.isIndoor) {
                    const indoorSize = 6;
                    tileSize = this.canvasSize / indoorSize;
                    const offsetX = (this.canvasSize - indoorSize * tileSize) / 2;
                    const offsetY = (this.canvasSize - indoorSize * tileSize) / 2;
                    
                    x = this.aim.x * tileSize + offsetX;
                    y = this.aim.y * tileSize + offsetY;
                } else {
                    tileSize = this.TILE_SIZE;
                    x = this.aim.x * tileSize;
                    y = this.aim.y * tileSize;
                }
                
                const cursor = document.createElement('div');
                cursor.className = 'aim-cell';
                cursor.style.left = x + 'px';
                cursor.style.top = y + 'px';
                cursor.style.width = tileSize + 'px';
                cursor.style.height = tileSize + 'px';
                
                this.aimOverlay.appendChild(cursor);
            }
            
            findTargetAt(shooter, x, y) {
                if (this.isIndoor) {
                    return this.players.find(p => 
                        p.alive && 
                        p !== shooter && 
                        p.inHouse === shooter.inHouse &&
                        p.indoorPos && 
                        p.indoorPos.x === x && 
                        p.indoorPos.y === y
                    );
                } else {
                    return this.players.find(p => 
                        p.alive && 
                        p !== shooter && 
                        !p.inHouse &&
                        p.x === x && 
                        p.y === y
                    );
                }
            }
            
            checkLineOfSight(shooter, target) {
                if (this.weapons[shooter.weapon].type === 'flame') {
                    return true;
                }
                
                let x1, y1, x2, y2, map;
                
                if (this.isIndoor) {
                    x1 = shooter.indoorPos.x;
                    y1 = shooter.indoorPos.y;
                    x2 = target.indoorPos.x;
                    y2 = target.indoorPos.y;
                    map = this.currentHouse.indoorMap;
                } else {
                    x1 = shooter.x;
                    y1 = shooter.y;
                    x2 = target.x;
                    y2 = target.y;
                    map = this.map;
                }
                
                // Simple line-of-sight check
                const dx = Math.abs(x2 - x1);
                const dy = Math.abs(y2 - y1);
                const sx = (x1 < x2) ? 1 : -1;
                const sy = (y1 < y2) ? 1 : -1;
                let err = dx - dy;
                
                let x = x1;
                let y = y1;
                
                while (true) {
                    if (x !== x1 || y !== y1) {
                        if (map[y] && map[y][x] && map[y][x].blocks) {
                            return false;
                        }
                    }
                    
                    if (x === x2 && y === y2) break;
                    
                    const e2 = 2 * err;
                    if (e2 > -dy) {
                        err -= dy;
                        x += sx;
                    }
                    if (e2 < dx) {
                        err += dx;
                        y += sy;
                    }
                }
                
                return true;
            }
            
            applyDamage(shooter, target, damage) {
                // Apply armor
                let finalDamage = damage;
                if (target.armor && target.armor.effect === 'damageReduction') {
                    finalDamage = Math.floor(damage * (1 - target.armor.value));
                }
                
                target.hp -= finalDamage;
                
                // Show damage effect
                this.showDamageEffect(
                    this.isIndoor ? target.indoorPos.x : target.x,
                    this.isIndoor ? target.indoorPos.y : target.y,
                    finalDamage
                );
                
                if (target.hp <= 0) {
                    target.alive = false;
                    target.hp = 0;
                    
                    // Remove from house
                    if (target.inHouse) {
                        const house = target.inHouse;
                        const playerIndex = this.players.indexOf(target);
                        const houseIndex = house.playersInside.indexOf(playerIndex);
                        if (houseIndex > -1) {
                            house.playersInside.splice(houseIndex, 1);
                        }
                        target.inHouse = null;
                        target.indoorPos = null;
                        
                        // Check if house empty
                        if (house.playersInside.length === 0 && this.isIndoor && this.currentHouse === house) {
                            this.isIndoor = false;
                            this.currentHouse = null;
                        }
                    }
                    
                    const shooterIndex = this.players.indexOf(shooter);
                    const targetIndex = this.players.indexOf(target);
                    this.showNotification(`🎯 Player ${shooterIndex + 1} eliminated Player ${targetIndex + 1}!`);
                    
                    // Check for winner
                    const alivePlayers = this.players.filter(p => p.alive);
                    if (alivePlayers.length === 1) {
                        const winnerIndex = this.players.findIndex(p => p.alive);
                        this.showNotification(`🏆 PLAYER ${winnerIndex + 1} WINS! 🏆`, 5000);
                        this.gameActive = false;
                    }
                }
                
                this.updateUI();
                this.updateSidePanel();
            }
            
            showDamageEffect(x, y, damage) {
                const effect = document.createElement('div');
                effect.className = 'damage-effect';
                effect.textContent = `-${damage}`;
                
                let posX, posY;
                if (this.isIndoor) {
                    const indoorSize = 6;
                    const tileSize = this.canvasSize / indoorSize;
                    const offsetX = (this.canvasSize - indoorSize * tileSize) / 2;
                    const offsetY = (this.canvasSize - indoorSize * tileSize) / 2;
                    
                    posX = x * tileSize + offsetX + tileSize / 2;
                    posY = y * tileSize + offsetY;
                } else {
                    posX = x * this.TILE_SIZE + this.TILE_SIZE / 2;
                    posY = y * this.TILE_SIZE;
                }
                
                effect.style.left = `${posX}px`;
                effect.style.top = `${posY}px`;
                
                document.getElementById('game-area').appendChild(effect);
                
                setTimeout(() => effect.remove(), 1000);
            }
            
            updateViewForCurrentPlayer() {
                const player = this.players[this.currentPlayer];
                
                if (player.inHouse) {
                    this.isIndoor = true;
                    this.currentHouse = player.inHouse;
                } else {
                    this.isIndoor = false;
                    this.currentHouse = null;
                }
            }
            
            // The following methods would be implemented similarly to the original game:
            // enterHouse(), pickupItem(), moveAim(), getShotgunPattern(), etc.
            // They would follow the same logic but adapted for the mobile interface
            
            // Placeholder for unimplemented methods
            enterHouse(player, x, y) {
                // Similar to original but with mobile notifications
                this.showNotification("🏠 Entered house! Use 🚪 to exit.");
                // Implementation would be similar to original
            }
            
            pickupItem(x, y) {
                // Simplified for mobile
                const player = this.players[this.currentPlayer];
                const isWeapon = Math.random() < 0.7;
                
                if (isWeapon) {
                    const weapons = Object.keys(this.weapons).filter(w => w !== player.weapon);
                    if (weapons.length > 0) {
                        const newWeapon = weapons[Math.floor(Math.random() * weapons.length)];
                        player.weapon = newWeapon;
                        this.showNotification(`🎁 Found ${this.weapons[newWeapon].name}!`);
                    }
                } else {
                    const gearKeys = Object.keys(this.gearTypes);
                    const gearKey = gearKeys[Math.floor(Math.random() * gearKeys.length)];
                    const gear = this.gearTypes[gearKey];
                    
                    if (gearKey === 'medkit') {
                        player.hp = Math.min(player.maxHp, player.hp + gear.value);
                        this.showNotification(`💊 Healed ${gear.value} HP!`);
                    } else if (gearKey === 'armor') {
                        player.armor = gear;
                        this.showNotification(`🛡️ Equipped ${gear.name}!`);
                    } else {
                        player.gear.push(gear);
                        this.showNotification(`${gear.emoji} Got ${gear.name}!`);
                    }
                }
                
                this.map[y][x] = null;
                this.updateUI();
            }
            
            moveAim(dx, dy) {
                // Similar to original but with mobile optimizations
                if (!this.aiming) return;
                
                const player = this.players[this.currentPlayer];
                const weapon = this.weapons[player.weapon];
                
                // Calculate range
                let range = weapon.range;
                player.gear.forEach(g => {
                    if (g.effect === 'rangeBonus') range += g.value;
                });
                
                // Set direction
                if (this.aim.dx === null && this.aim.dy === null) {
                    this.aim.dx = dx;
                    this.aim.dy = dy;
                }
                
                // Check direction and range
                if (dx !== this.aim.dx || dy !== this.aim.dy || this.aim.steps >= range) {
                    return;
                }
                
                // Update position
                this.aim.x += dx;
                this.aim.y += dy;
                this.aim.steps++;
                
                this.updateAimCursor();
                this.vibrate(30);
            }
            
            gameLoop() {
                if (this.gameActive) {
                    this.draw();
                }
                requestAnimationFrame(() => this.gameLoop());
            }
        }
        
        // Initialize game when page loads
        window.addEventListener('load', () => {
            window.game = new MobileBattleRoyale();
        });
        
        // Handle fullscreen change
        document.addEventListener('fullscreenchange', () => {
            game.isFullscreen = !!document.fullscreenElement;
        });
        
        document.addEventListener('webkitfullscreenchange', () => {
            game.isFullscreen = !!document.webkitFullscreenElement;
        });
    </script>
